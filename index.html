                    <span>ציפיות</span>
                </div>
                <div class="w-full bg-metal-900 rounded-full h-2 border border-metal-700 p-0.5 box-content">
                    <div id="progress-bar" class="bg-gradient-to-r from-orange-600 to-orange-accent h-2 rounded-full transition-all duration-500 ease-out shadow-[0_0_8px_rgba(255,122,0,0.8)]" style="width: 16.6%"></div>

                <div id="step-1" class="step-container active">

<!-- ... existing code ... -->
                <!-- Reset Button -->
                <button onclick="resetForm()" class="bg-metal-700 hover:bg-metal-600 border border-metal-500 text-slate-200 px-6 py-3 rounded-xl text-sm transition-colors mx-auto flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />

                    חזרה להתחלה (בדיקה)

    <!-- Footer Right Text -->
    <div class="fixed bottom-2 right-2 md:bottom-4 md:right-4 text-slate-500 text-[10px] md:text-xs font-medium z-20 opacity-80 bg-metal-900/50 p-1.5 rounded-md backdrop-blur-sm">
        נוצר ע"י : שטיבלמן נטלה - אחות מומחית קלינית בסוכרת
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 6;

        function nextStep(step) {
            // Hide current
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            
            // Update step
            currentStep = step;
            
            // Show new
            document.getElementById(`step-${currentStep}`).classList.add('active');
            
            // Update Progress Bar
            const progress = (currentStep / totalSteps) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            // Scroll smoothly to top of the form panel
            document.querySelector('.glass-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showSuccess() {
            // מסתיר את הטופס ומציג את ההודעה הירוקה
            document.getElementById('ai-nursing-form').style.display = 'none';
            document.getElementById('progress-section').style.display = 'none'; 
            document.getElementById('success-message').classList.remove('hidden');
            document.querySelector('.glass-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetForm() {
            // איפוס לבדיקות
            document.getElementById('ai-nursing-form').reset();
            document.getElementById('success-message').classList.add('hidden');
            document.getElementById('ai-nursing-form').style.display = 'block';
            document.getElementById('progress-section').style.display = 'block';
            
            nextStep(1); 
        }

        // --- מנגנון שליחה חדש לגוגל פורמס ---
        document.getElementById('ai-nursing-form').addEventListener('submit', function(e) {
            e.preventDefault(); // עוצר את התנהגות השליחה הרגילה כדי לא לטעון דף חדש
            
            const form = this;
            const url = form.action;
            const formData = new FormData(form);
            const submitBtn = document.getElementById('submit-btn');
            const originalBtnContent = submitBtn.innerHTML;

            // שינוי כפתור לחיווי שליחה בזמן אמת
            submitBtn.innerHTML = '<span class="animate-pulse font-bold text-xl">שולח נתונים...</span>';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // שליחת הנתונים מאחורי הקלעים בעזרת no-cors (הכרחי לעבודה מול גוגל פורמס)
            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            }).then(() => {
                showSuccess(); // אם הבקשה נשלחה, נציג הודעת הצלחה
                
                // החזרת הכפתור למצבו המקורי (למקרה שהמשתמש יאפס את הטופס)
                submitBtn.innerHTML = originalBtnContent; 
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }).catch((error) => {
                console.error('Submission failed:', error);
                alert('אירעה שגיאה בשליחת השאלון, ייתכן וישנה בעיית חיבור. אנא נסה שוב.');
                
                // החזרת הכפתור במקרה של שגיאה
                submitBtn.innerHTML = originalBtnContent;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            });
        });
    </script>
</body>
</html>
